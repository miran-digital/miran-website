name: One Shot Payment Minimum Fix

on:
  pull_request:
    paths:
      - ".github/workflows/one-shot-fix-payment-minimum.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply guarded provider-minimum patch and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/marketplace-core/postgres/payment-service.js")
          text = path.read_text()
          old = '      assert(amountIrr >= 10_000, "Order amount is below Zarinpal minimum", "INVALID_PAYMENT_AMOUNT");'
          new = '      assert(amountIrr > 0, "Order amount must be positive", "INVALID_PAYMENT_AMOUNT");'
          count = text.count(old)
          if count == 1:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif count == 0 and new in text:
              pass
          else:
              raise SystemExit(f"Payment minimum guard matched {count} blocks; refusing patch")
          PY

          rm .github/workflows/one-shot-fix-payment-minimum.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(postgres): delegate provider minimum validation to gateway"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
