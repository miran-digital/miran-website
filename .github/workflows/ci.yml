name: CI

on:
  pull_request:
  push:
    branches: [main, "chore/bootstrap-monorepo"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Validate marketplace core syntax
        run: |
          node --check services/marketplace-core/src/database.js
          node --check services/marketplace-core/src/core.js
          node --check services/marketplace-core/src/server.js
          node --check services/marketplace-core/tests/core.test.js
      - name: Test marketplace core
        run: node --test services/marketplace-core/tests/core.test.js
