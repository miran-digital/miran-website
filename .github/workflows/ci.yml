name: CI

on:
  pull_request:
  push:
    branches: [main, "chore/bootstrap-monorepo"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: miran_test
          POSTGRES_USER: miran
          POSTGRES_PASSWORD: miran_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U miran -d miran_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://miran:miran_ci_password@127.0.0.1:5432/miran_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Validate marketplace core syntax
        run: |
          find services/marketplace-core/src services/marketplace-core/postgres services/marketplace-core/tests services/marketplace-core/scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test marketplace core
        run: node --test services/marketplace-core/tests/*.test.js
