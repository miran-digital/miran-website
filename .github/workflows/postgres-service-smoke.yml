name: PostgreSQL Service Smoke

on:
  pull_request:
    paths:
      - "infra/docker-compose.production.yml"
      - "infra/postgres/**"
      - "services/marketplace-core/postgres/**"
      - ".github/workflows/postgres-service-smoke.yml"

permissions:
  contents: read

jobs:
  postgres-service-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: miran_postgres_ci
      POSTGRES_USER: miran
      POSTGRES_PASSWORD: miran_postgres_ci_password
      REDIS_PASSWORD: miran_postgres_ci_redis_password
      DATABASE_POOL_MAX: 4
      ZARINPAL_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL and run application migrations
        run: docker compose -f infra/docker-compose.production.yml up -d --build postgres auth-service

      - name: Verify authenticated PostgreSQL health and schema
        run: |
          set -euo pipefail
          sql() {
            docker compose -f infra/docker-compose.production.yml exec -T postgres sh -ec \
              'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "$1"' -- "$1"
          }

          test "$(sql 'SELECT 1')" = "1"

          expected_migrations="$(find services/marketplace-core/postgres/migrations -maxdepth 1 -type f -name '[0-9]*.sql' | wc -l | tr -d ' ')"
          applied_migrations="$(sql 'SELECT count(*) FROM schema_migrations')"
          test "$applied_migrations" = "$expected_migrations"

          for table in users sessions addresses categories products inventory orders schema_migrations; do
            test "$(sql "SELECT CASE WHEN to_regclass('public.${table}') IS NULL THEN 0 ELSE 1 END")" = "1"
          done

          if docker compose -f infra/docker-compose.production.yml port postgres 5432 2>/dev/null | grep -q .; then
            echo "PostgreSQL must not publish host port 5432" >&2
            exit 1
          fi

      - name: Verify PostgreSQL volume survives container restart
        run: |
          set -euo pipefail
          before="$(docker compose -f infra/docker-compose.production.yml exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT count(*) FROM schema_migrations"')"
          docker compose -f infra/docker-compose.production.yml restart postgres
          ready=0
          for attempt in $(seq 1 30); do
            if docker compose -f infra/docker-compose.production.yml exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT 1"' | grep -qx 1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          after="$(docker compose -f infra/docker-compose.production.yml exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT count(*) FROM schema_migrations"')"
          test "$after" = "$before"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.production.yml logs --no-color postgres auth-service

      - name: Stop PostgreSQL test stack
        if: always()
        run: docker compose -f infra/docker-compose.production.yml down -v --remove-orphans
