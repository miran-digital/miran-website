name: Eight Service Stack

on:
  pull_request:

permissions:
  contents: read

jobs:
  eight-service-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DB: miran_eight_service_ci
      POSTGRES_USER: miran
      POSTGRES_PASSWORD: miran_eight_service_ci_password
      REDIS_PASSWORD: miran_eight_service_redis_ci_password
      DATABASE_POOL_MAX: 4
      SITE_INDEXABLE: "false"
      MIRAN_PUBLIC_URL: http://localhost:3800
      MIRAN_SITE_ADDRESS: http://localhost
      MIRAN_WWW_SITE_ADDRESS: http://www.localhost
      MIRAN_CANONICAL_URL: http://localhost:3800
      HTTP_PORT: 3800
      HTTPS_PORT: 3843
      GATEWAY_AUTH_RATE_LIMIT_PER_MINUTE: 3
      ZARINPAL_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact production service set
        run: |
          expected="admin-service api-gateway auth-service caddy catalog-service postgres redis web"
          actual="$(docker compose -f infra/docker-compose.production.yml config --services | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$actual" = "$expected"

      - name: Build and start all eight production services
        run: docker compose -f infra/docker-compose.production.yml up -d --build

      - name: Wait for Caddy storefront edge
        run: |
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS -H 'Host: localhost' http://127.0.0.1:3800/ >/tmp/miran-eight-home.html; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -f infra/docker-compose.production.yml ps
            docker compose -f infra/docker-compose.production.yml logs --no-color
            exit 1
          fi
          test -s /tmp/miran-eight-home.html

      - name: Verify gateway health and downstream service identities
        run: |
          docker compose -f infra/docker-compose.production.yml exec -T api-gateway node <<'NODE'
          const health = await fetch('http://127.0.0.1:3001/health');
          if (!health.ok) process.exit(1);
          const body = await health.json();
          if (!body.ok || body.redis !== 'ready') process.exit(1);
          if (body.downstream?.auth !== 'auth-service') process.exit(1);
          if (body.downstream?.catalog !== 'catalog-service') process.exit(1);
          if (body.downstream?.admin !== 'admin-service') process.exit(1);

          const checks = [
            ['/v1/me', 'auth-service', 401],
            ['/v1/catalog/categories', 'catalog-service', 200],
            ['/v1/admin/categories', 'admin-service', 401],
          ];
          for (const [path, expectedUpstream, expectedStatus] of checks) {
            const response = await fetch(`http://127.0.0.1:3001${path}`);
            if (response.status !== expectedStatus) {
              console.error(path, response.status, await response.text());
              process.exit(1);
            }
            if (response.headers.get('x-miran-upstream') !== expectedUpstream) {
              console.error(path, response.headers.get('x-miran-upstream'));
              process.exit(1);
            }
          }
          NODE

      - name: Verify auth through Caddy Web BFF Gateway and Auth service
        run: |
          email="eight-service-$(date +%s)@example.com"
          password="very-secure-eight-service-pass-123"

          weak_status="$(curl -sS -o /tmp/weak-register.json -w '%{http_code}' \
            -H 'Host: localhost' \
            -H 'content-type: application/json' \
            -d "{\"email\":\"weak-${email}\",\"password\":\"short\"}" \
            http://127.0.0.1:3800/api/auth/register)"
          test "$weak_status" = "400"

          register_status="$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -H 'Host: localhost' \
            -c /tmp/cookies.txt \
            -H 'content-type: application/json' \
            -d "{\"email\":\"${email}\",\"password\":\"${password}\"}" \
            http://127.0.0.1:3800/api/auth/register)"
          test "$register_status" = "201" -o "$register_status" = "200"

          me_status="$(curl -sS -o /tmp/me.json -w '%{http_code}' \
            -H 'Host: localhost' \
            -b /tmp/cookies.txt \
            http://127.0.0.1:3800/api/auth/me)"
          test "$me_status" = "200"
          grep -q "$email" /tmp/me.json

          logout_status="$(curl -sS -o /tmp/logout.json -w '%{http_code}' \
            -X POST \
            -H 'Host: localhost' \
            -b /tmp/cookies.txt \
            -c /tmp/cookies.txt \
            http://127.0.0.1:3800/api/auth/logout)"
          test "$logout_status" = "204"

          after_logout_status="$(curl -sS -o /tmp/me-after-logout.json -w '%{http_code}' \
            -H 'Host: localhost' \
            -b /tmp/cookies.txt \
            http://127.0.0.1:3800/api/auth/me)"
          test "$after_logout_status" = "401"

      - name: Verify Auth service route boundary
        run: |
          docker compose -f infra/docker-compose.production.yml exec -T auth-service node <<'NODE'
          const health = await fetch('http://127.0.0.1:3001/health');
          if (!health.ok) process.exit(1);
          const healthBody = await health.json();
          if (healthBody.ok !== true || healthBody.service !== 'auth-service') process.exit(1);

          const outsideScope = await fetch('http://127.0.0.1:3001/v1/catalog/categories');
          if (outsideScope.status !== 404) {
            console.error('Auth service accepted catalog route', outsideScope.status);
            process.exit(1);
          }
          NODE

      - name: Verify Catalog service boundary and maintenance health
        run: |
          docker compose -f infra/docker-compose.production.yml exec -T catalog-service node <<'NODE'
          const health = await fetch('http://127.0.0.1:3001/health');
          if (!health.ok) process.exit(1);
          const healthBody = await health.json();
          if (healthBody.ok !== true || healthBody.service !== 'catalog-service') process.exit(1);
          if (healthBody.maintenance !== 'running') {
            console.error('Catalog maintenance not healthy', healthBody);
            process.exit(1);
          }

          const categories = await fetch('http://127.0.0.1:3001/v1/catalog/categories');
          if (categories.status !== 200) process.exit(1);

          for (const path of ['/v1/admin/categories', '/v1/me']) {
            const response = await fetch(`http://127.0.0.1:3001${path}`);
            if (response.status !== 404) {
              console.error('Catalog service accepted outside-scope route', path, response.status);
              process.exit(1);
            }
          }
          NODE

      - name: Verify Redis-backed gateway auth rate limit
        run: |
          docker compose -f infra/docker-compose.production.yml exec -T api-gateway node <<'NODE'
          let fourth = null;
          for (let i = 1; i <= 4; i += 1) {
            const response = await fetch('http://127.0.0.1:3001/v1/auth/login', {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify({email: 'missing@example.com', password: 'wrong-password'}),
            });
            if (i < 4 && response.status === 429) process.exit(1);
            if (i === 4) fourth = response.status;
          }
          if (fourth !== 429) {
            console.error('Expected fourth login attempt to be rate limited, got', fourth);
            process.exit(1);
          }
          NODE

      - name: Verify exactly eight services are running
        run: |
          expected="admin-service api-gateway auth-service caddy catalog-service postgres redis web"
          actual="$(docker compose -f infra/docker-compose.production.yml ps --status running --services | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$actual" = "$expected"

      - name: Verify internal services are not published on legacy API port
        run: |
          if curl -fsS --max-time 2 http://127.0.0.1:3001/health >/dev/null 2>&1; then
            echo "Internal API unexpectedly exposed on host port 3001" >&2
            exit 1
          fi

      - name: Show stack logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.production.yml logs --no-color

      - name: Stop eight-service stack
        if: always()
        run: docker compose -f infra/docker-compose.production.yml down -v --remove-orphans
