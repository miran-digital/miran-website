name: Full Stack Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: miran_smoke
      POSTGRES_USER: miran
      POSTGRES_PASSWORD: miran_smoke_ci_password
      DATABASE_POOL_MAX: 5
      WEB_PORT: 3200
      SITE_INDEXABLE: "false"
      MIRAN_PUBLIC_URL: http://127.0.0.1:3200
      ZARINPAL_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Build and start production-like stack
        run: |
          docker compose -f infra/docker-compose.full-stack.staging.yml up -d --build

      - name: Wait for storefront
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3200/ >/tmp/miran-home.html; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -f infra/docker-compose.full-stack.staging.yml ps
            docker compose -f infra/docker-compose.full-stack.staging.yml logs --no-color
            exit 1
          fi
          test -s /tmp/miran-home.html

      - name: Verify auth through Next.js BFF and PostgreSQL API
        run: |
          email="smoke-$(date +%s)@example.com"
          password="very-secure-smoke-pass-123"

          register_status="$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -c /tmp/cookies.txt \
            -H 'content-type: application/json' \
            -d "{\"email\":\"${email}\",\"password\":\"${password}\"}" \
            http://127.0.0.1:3200/api/auth/register)"
          test "$register_status" = "201" -o "$register_status" = "200"

          me_status="$(curl -sS -o /tmp/me.json -w '%{http_code}' \
            -b /tmp/cookies.txt \
            http://127.0.0.1:3200/api/auth/me)"
          test "$me_status" = "200"
          grep -q "$email" /tmp/me.json

          logout_status="$(curl -sS -o /tmp/logout.txt -w '%{http_code}' \
            -b /tmp/cookies.txt \
            -c /tmp/cookies.txt \
            -X POST \
            http://127.0.0.1:3200/api/auth/logout)"
          test "$logout_status" = "204" -o "$logout_status" = "200"

          after_logout="$(curl -sS -o /tmp/me-after.json -w '%{http_code}' \
            -b /tmp/cookies.txt \
            http://127.0.0.1:3200/api/auth/me)"
          test "$after_logout" = "401"

      - name: Verify API is not published by full-stack baseline
        run: |
          if curl -fsS --max-time 2 http://127.0.0.1:3001/health >/dev/null 2>&1; then
            echo "marketplace-core unexpectedly exposed on host port 3001" >&2
            exit 1
          fi

      - name: Show stack logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.full-stack.staging.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker-compose.full-stack.staging.yml down -v --remove-orphans
