name: One Shot Payment Expiry Fix V2

on:
  pull_request:
    paths:
      - ".github/workflows/one-shot-fix-payment-expiry-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exactly-one guarded patch and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("services/marketplace-core/postgres/payment-service.js")
          text = path.read_text()

          expiry = re.compile(
              r'(?m)^(?P<i>\s*)if \(reservations\.rows\.some\(\(item\) => new Date\(item\.expires_at\) <= now\)\) \{\n'
              r'(?P=i)  await this\.releaseOrderInsideTransaction\(client, orderId, "PAYMENT_FAILED"\);\n'
              r'(?P=i)  fail\("Inventory reservation has expired", "CONFLICT"\);\n'
              r'(?P=i)\}'
          )
          matches = list(expiry.finditer(text))
          if len(matches) == 1:
              def replace_expiry(match):
                  i = match.group("i")
                  return (
                      f'{i}if (reservations.rows.some((item) => new Date(item.expires_at) <= now)) {{\n'
                      f'{i}  await this.releaseOrderInsideTransaction(client, orderId, "PAYMENT_FAILED");\n'
                      f'{i}  return {{ expired: true, orderId }};\n'
                      f'{i}}}'
                  )
              text = expiry.sub(replace_expiry, text, count=1)
          elif len(matches) == 0 and 'return { expired: true, orderId };' in text:
              pass
          else:
              raise SystemExit(f"Expiry guard matched {len(matches)} blocks; refusing patch")

          reused = re.compile(r'(?m)^(?P<i>\s*)if \(prepared\.reused\) return prepared;$')
          reused_matches = list(reused.finditer(text))
          if len(reused_matches) == 1 and 'if (prepared.expired)' not in text:
              def replace_reused(match):
                  i = match.group("i")
                  return (
                      f'{i}if (prepared.expired) {{\n'
                      f'{i}  fail("Inventory reservation has expired", "CONFLICT");\n'
                      f'{i}}}\n'
                      f'{i}if (prepared.reused) return prepared;'
                  )
              text = reused.sub(replace_reused, text, count=1)
          elif len(reused_matches) == 1 and 'if (prepared.expired)' in text:
              pass
          else:
              raise SystemExit(f"Prepared guard matched {len(reused_matches)} blocks; refusing patch")

          if 'return { expired: true, orderId };' not in text or 'if (prepared.expired)' not in text:
              raise SystemExit("Post-patch invariants missing; refusing commit")

          path.write_text(text)
          PY

          rm -f .github/workflows/one-shot-fix-payment-expiry.yml
          rm -f .github/workflows/one-shot-fix-payment-expiry-v2.yml

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No guarded changes to commit."
            exit 0
          fi
          git commit -m "fix(postgres): commit expired reservation release before conflict"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
