name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miran-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment ref is committed
        run: |
          git cat-file -e "${GITHUB_SHA}^{commit}"
          test -f infra/scripts/deploy-production.sh
          test -f infra/docker-compose.production.yml

      - name: Configure SSH with pinned host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_miran_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_miran_deploy ~/.ssh/known_hosts

      - name: Deploy exact workflow commit with backup-first remote script
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          REMOTE_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          REMOTE_BACKUP_DIR: ${{ secrets.PRODUCTION_BACKUP_DIR }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          port="${DEPLOY_PORT:-22}"
          env_file="${REMOTE_ENV_FILE:-/etc/miran/production.env}"
          backup_dir="${REMOTE_BACKUP_DIR:-/var/backups/miran}"

          # Values below come from protected GitHub Environment secrets. Quoting
          # prohibits the remote shell from interpreting spaces in paths.
          ssh -i ~/.ssh/id_miran_deploy -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && MIRAN_ENV_FILE='$env_file' MIRAN_BACKUP_DIR='$backup_dir' sh infra/scripts/deploy-production.sh '$GITHUB_SHA'"
