name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      allow_initial_empty_host:
        description: "Allow first deployment only when the target host has no Miran containers or persistent volumes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: miran-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment ref is committed
        run: |
          git cat-file -e "${GITHUB_SHA}^{commit}"
          test -f infra/scripts/deploy-production.sh
          test -f infra/scripts/inspect-production.sh
          test -f infra/backup/create-full-live-backup.sh
          test -f infra/backup/verify-full-live-backup.sh
          test -f infra/docker-compose.production.yml
          bash -n infra/scripts/deploy-production.sh

      - name: Configure SSH with pinned host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_miran_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_miran_deploy ~/.ssh/known_hosts

      - name: Preflight, full-backup, verify and deploy exact workflow commit
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          REMOTE_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          REMOTE_BACKUP_DIR: ${{ secrets.PRODUCTION_BACKUP_DIR }}
          ALLOW_INITIAL_EMPTY_HOST: ${{ inputs.allow_initial_empty_host }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          port="${DEPLOY_PORT:-22}"
          env_file="${REMOTE_ENV_FILE:-/etc/miran/production.env}"
          backup_dir="${REMOTE_BACKUP_DIR:-/var/backups/miran}"
          allow_initial="false"
          if [ "$ALLOW_INITIAL_EMPTY_HOST" = "true" ]; then
            allow_initial="true"
          fi

          for remote_value in "$DEPLOY_PATH" "$env_file" "$backup_dir"; do
            case "$remote_value" in
              *"'"*)
                echo "Production path values must not contain single quotes." >&2
                exit 1
                ;;
            esac
          done

          # Execute the deploy script from this exact reviewed workflow commit by
          # streaming it over pinned SSH. Do not trust an older copy on the host.
          ssh -i ~/.ssh/id_miran_deploy -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && MIRAN_ENV_FILE='$env_file' MIRAN_BACKUP_DIR='$backup_dir' MIRAN_ALLOW_INITIAL_EMPTY_HOST='$allow_initial' bash -s -- '$GITHUB_SHA'" \
            < infra/scripts/deploy-production.sh
