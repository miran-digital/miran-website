services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miran}
      POSTGRES_USER: ${POSTGRES_USER:-miran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - miran_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miran} -d ${POSTGRES_DB:-miran}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [miran_internal]

  marketplace-core:
    build:
      context: ..
      dockerfile: services/marketplace-core/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &core-env
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-miran}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-miran}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      MIRAN_PUBLIC_URL: ${MIRAN_PUBLIC_URL:-https://almiran.ir}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      MIRAN_OBJECT_STORAGE_ENDPOINT: ${MIRAN_OBJECT_STORAGE_ENDPOINT:-}
      MIRAN_OBJECT_STORAGE_BUCKET: ${MIRAN_OBJECT_STORAGE_BUCKET:-}
      MIRAN_OBJECT_STORAGE_REGION: ${MIRAN_OBJECT_STORAGE_REGION:-auto}
      MIRAN_OBJECT_STORAGE_ACCESS_KEY_ID: ${MIRAN_OBJECT_STORAGE_ACCESS_KEY_ID:-}
      MIRAN_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MIRAN_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      MIRAN_OBJECT_STORAGE_FORCE_PATH_STYLE: ${MIRAN_OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      MIRAN_PUBLIC_MEDIA_ENDPOINT: ${MIRAN_PUBLIC_MEDIA_ENDPOINT:-}
      MIRAN_PUBLIC_MEDIA_BUCKET: ${MIRAN_PUBLIC_MEDIA_BUCKET:-}
      MIRAN_PUBLIC_MEDIA_REGION: ${MIRAN_PUBLIC_MEDIA_REGION:-auto}
      MIRAN_PUBLIC_MEDIA_ACCESS_KEY_ID: ${MIRAN_PUBLIC_MEDIA_ACCESS_KEY_ID:-}
      MIRAN_PUBLIC_MEDIA_SECRET_ACCESS_KEY: ${MIRAN_PUBLIC_MEDIA_SECRET_ACCESS_KEY:-}
      MIRAN_PUBLIC_MEDIA_FORCE_PATH_STYLE: ${MIRAN_PUBLIC_MEDIA_FORCE_PATH_STYLE:-false}
      MIRAN_PUBLIC_MEDIA_BASE_URL: ${MIRAN_PUBLIC_MEDIA_BASE_URL:-https://media.almiran.ir}
    command: ["node", "services/marketplace-core/src/start.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [miran_internal]

  marketplace-maintenance:
    build:
      context: ..
      dockerfile: services/marketplace-core/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *core-env
      MIRAN_MAINTENANCE_INTERVAL_MS: ${MIRAN_MAINTENANCE_INTERVAL_MS:-60000}
    command: ["node", "services/marketplace-core/postgres/maintenance.js"]
    networks: [miran_internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      marketplace-core:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://marketplace-core:3001
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      NEXT_PUBLIC_SITE_URL: ${MIRAN_PUBLIC_URL:-https://almiran.ir}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [miran_internal]

networks:
  miran_internal:
    driver: bridge

volumes:
  miran_postgres_data:
